<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>troy</title>
  <style>
    :root { --bg:#0d1017; --panel:#151a24; --border:#232a38; --text:#d7dce5; --muted:#8b93a3; --accent:#6ea8fe; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; gap:16px; align-items:center; }
    header h1 { font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; }
    header h1 span { color:var(--muted); font-weight:400; }
    main { padding:24px; display:grid; grid-template-columns: 1fr 1fr; gap:24px; max-width:1200px; margin:0 auto; }
    section { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; }
    section.full { grid-column: 1 / -1; }
    h2 { margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { text-align:left; color:var(--muted); font-weight:500; padding:4px 8px; border-bottom:1px solid var(--border); }
    td { padding:4px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
    .muted { color:var(--muted); }
    .ok { color:#4ade80; } .err { color:#f87171; }
    input, select, button { background:#0d1017; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 8px; font:inherit; }
    button { cursor:pointer; }
    button:hover { border-color:var(--accent); }
    form { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:end; }
    form label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
    .tag { display:inline-block; padding:0 6px; border-radius:4px; font-size:11px; background:#1c2433; border:1px solid var(--border); }
    .spread { display:flex; justify-content:space-between; align-items:center; }
  </style>
</head>
<body>
  <header>
    <h1>troy<span> · minimal ai router</span></h1>
    <span class="muted" id="proxyHint"></span>
  </header>
  <main>
    <section class="full">
      <div class="spread"><h2>connections</h2><button id="refreshConn">refresh</button></div>
      <table id="connTable"><thead><tr><th>provider</th><th>priority</th><th>api key</th><th>base url</th><th></th></tr></thead><tbody></tbody></table>
    </section>
    <section>
      <h2>combos</h2>
      <div id="comboList"></div>
    </section>
    <section>
      <h2>settings</h2>
      <div id="settingsBox"></div>
    </section>
    <section class="full">
      <h2>last requests</h2>
      <table><thead><tr><th>ts</th><th>provider</th><th>model</th><th>status</th><th>ms</th></tr></thead><tbody id="logBody"></tbody></table>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
